ctransformers:
  model_path:
    small: "./models/mistral-7b-instruct-v0.1.Q3_K_M.gguf"
    large:  "./models/mistral-7b-instruct-v0.1.Q5_K_M.gguf" 
  model_type: "mistral"
  model_config: 
    'max_new_tokens': 8192
    'temperature' : 0.0
    'context_length': 32768
    'gpu_layers' : 0 #32 to put all layers on GPU
    'threads' : -1

ollama_model:
  model_path:
    small3.1: "llama3.1:8b"
    large3.1: "llama3.1:70b"
    small3: "llama3:instruct"
    large3: "llama3:70b-instruct"

llava_model:
  llava_model_path: "./models/llava/ggml-model-q5_k.gguf"
  clip_model_path: "./models/llava/mmproj-model-f16.gguf"

whisper_model: "openai/whisper-small"

embeddings_path:
  model_path:
    first: "snowflake-arctic-embed:latest"
    second: "nomic-embed-text:latest"
    third: "mxbai-embed-large:latest"

chromadb:
  chromadb_path: "chroma_db"
  collection_name: "myData"

chat_sessions_database_path: "./chat_sessions/chat_sessions.db"

